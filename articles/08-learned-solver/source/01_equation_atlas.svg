<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-label="Navier-Stokes equation atlas showing numerical and learned insertion points">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6470"/>
</marker>
<pattern id="dotgrid" width="10" height="10" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.1" fill="#6b7280" opacity="0.28"/>
</pattern>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#111827" flood-opacity="0.08"/>
</filter>
</defs>
<rect width="1600" height="1030" fill="#fcfcfa"/>
<text x="70" y="82" text-anchor="start" fill="#17191d" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:43px;font-weight:600;">The equation is not one box</text>
<text x="70" y="125" text-anchor="start" fill="#5c6470" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:20px;font-weight:400;">
<tspan x="70" dy="0">Every term becomes a different numerical operation, a different error source, and a different place where</tspan>
<tspan x="70" dy="27.0">learning can help.</tspan>
</text>
<line x1="70" y1="167" x2="1530" y2="167" stroke="#d7d6cf" stroke-width="1.5" stroke-linecap="round" opacity="1.0"/>
<text x="160" y="235" text-anchor="start" fill="#2563eb" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:42px;font-weight:600;">∂u/∂t</text>
<text x="320" y="235" text-anchor="start" fill="#17191d" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:42px;font-weight:500;">=</text>
<text x="380" y="235" text-anchor="start" fill="#2563eb" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:42px;font-weight:600;">− (u·∇)u</text>
<text x="625" y="235" text-anchor="start" fill="#17191d" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:42px;font-weight:500;">−</text>
<text x="675" y="235" text-anchor="start" fill="#dc2626" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:42px;font-weight:600;">(1/ρ)∇p</text>
<text x="900" y="235" text-anchor="start" fill="#17191d" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:42px;font-weight:500;">+</text>
<text x="955" y="235" text-anchor="start" fill="#059669" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:42px;font-weight:600;">ν∇²u</text>
<text x="1130" y="235" text-anchor="start" fill="#17191d" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:42px;font-weight:500;">+</text>
<text x="1180" y="235" text-anchor="start" fill="#6b7280" opacity="1.0" style="font-family:DejaVu Serif, Georgia, serif;font-size:42px;font-weight:700;">f</text>
<rect x="1285" y="202" width="190" height="45" rx="22.5" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5" opacity="1.0"/>
<text x="1380.0" y="232.6" text-anchor="middle" fill="#ffffff" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:15px;font-weight:700;">∇·u = 0</text>
<rect x="55" y="305" width="350" height="475" rx="18" fill="#ffffff" stroke="#d7d6cf" stroke-width="1.5" filter="url(#shadow)" opacity="1.0"/>
<rect x="55" y="305" width="350" height="7" rx="4" fill="#2563eb"/>
<text x="79" y="353" text-anchor="start" fill="#17191d" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:24px;font-weight:700;">Self-advection</text>
<text x="79" y="388" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;">PHYSICAL ROLE</text>
<text x="79" y="415" text-anchor="start" fill="#17191d" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:17px;font-weight:400;">
<tspan x="79" dy="0">The velocity field carries and</tspan>
<tspan x="79" dy="22.950000000000003">deforms itself. This is the</tspan>
<tspan x="79" dy="22.950000000000003">nonlinear term.</tspan>
</text>
<text x="79" y="490" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;">CLASSICAL NUMERICS</text>
<text x="79" y="517" text-anchor="start" fill="#17191d" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:17px;font-weight:400;">
<tspan x="79" dy="0">Finite-volume fluxes, finite</tspan>
<tspan x="79" dy="22.950000000000003">differences, or semi-Lagrangian</tspan>
<tspan x="79" dy="22.950000000000003">backtracing.</tspan>
</text>
<rect x="73" y="675" width="314" height="82" rx="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" stroke-dasharray="7 6" opacity="1.0"/>
<text x="89" y="705" text-anchor="start" fill="#111827" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:800;letter-spacing:1.4px;">LEARNED LANE</text>
<text x="89" y="731" text-anchor="start" fill="#111827" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:16px;font-weight:400;">
<tspan x="89" dy="0">Learn a flux, limiter, reconstruction,</tspan>
<tspan x="89" dy="21.6">or coarse-grid residual correction.</tspan>
</text>
<rect x="435" y="305" width="350" height="475" rx="18" fill="#ffffff" stroke="#d7d6cf" stroke-width="1.5" filter="url(#shadow)" opacity="1.0"/>
<rect x="435" y="305" width="350" height="7" rx="4" fill="#dc2626"/>
<text x="459" y="353" text-anchor="start" fill="#17191d" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:24px;font-weight:700;">Pressure + constraint</text>
<text x="459" y="388" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;">PHYSICAL ROLE</text>
<text x="459" y="415" text-anchor="start" fill="#17191d" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:17px;font-weight:400;">
<tspan x="459" dy="0">Pressure supplies exactly the</tspan>
<tspan x="459" dy="22.950000000000003">correction required to keep</tspan>
<tspan x="459" dy="22.950000000000003">incompressible flow divergence-</tspan>
<tspan x="459" dy="22.950000000000003">free.</tspan>
</text>
<text x="459" y="490" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;">CLASSICAL NUMERICS</text>
<text x="459" y="517" text-anchor="start" fill="#17191d" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:17px;font-weight:400;">
<tspan x="459" dy="0">Poisson equation plus Jacobi,</tspan>
<tspan x="459" dy="22.950000000000003">Krylov, multigrid, and a projection</tspan>
<tspan x="459" dy="22.950000000000003">step.</tspan>
</text>
<rect x="453" y="675" width="314" height="82" rx="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" stroke-dasharray="7 6" opacity="1.0"/>
<text x="469" y="705" text-anchor="start" fill="#111827" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:800;letter-spacing:1.4px;">LEARNED LANE</text>
<text x="469" y="731" text-anchor="start" fill="#111827" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:16px;font-weight:400;">
<tspan x="469" dy="0">Predict p₀, a preconditioner, a</tspan>
<tspan x="469" dy="21.6">smoother, or a multigrid prolongation</tspan>
<tspan x="469" dy="21.6">operator.</tspan>
</text>
<rect x="815" y="305" width="350" height="475" rx="18" fill="#ffffff" stroke="#d7d6cf" stroke-width="1.5" filter="url(#shadow)" opacity="1.0"/>
<rect x="815" y="305" width="350" height="7" rx="4" fill="#059669"/>
<text x="839" y="353" text-anchor="start" fill="#17191d" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:24px;font-weight:700;">Viscosity + closure</text>
<text x="839" y="388" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;">PHYSICAL ROLE</text>
<text x="839" y="415" text-anchor="start" fill="#17191d" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:17px;font-weight:400;">
<tspan x="839" dy="0">Molecular viscosity smooths</tspan>
<tspan x="839" dy="22.950000000000003">momentum; unresolved turbulence</tspan>
<tspan x="839" dy="22.950000000000003">adds missing stresses and fluxes.</tspan>
</text>
<text x="839" y="490" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;">CLASSICAL NUMERICS</text>
<text x="839" y="517" text-anchor="start" fill="#17191d" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:17px;font-weight:400;">
<tspan x="839" dy="0">Implicit diffusion plus RANS, LES,</tspan>
<tspan x="839" dy="22.950000000000003">interface, spray, or bubble</tspan>
<tspan x="839" dy="22.950000000000003">closures.</tspan>
</text>
<rect x="833" y="675" width="314" height="82" rx="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" stroke-dasharray="7 6" opacity="1.0"/>
<text x="849" y="705" text-anchor="start" fill="#111827" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:800;letter-spacing:1.4px;">LEARNED LANE</text>
<text x="849" y="731" text-anchor="start" fill="#111827" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:16px;font-weight:400;">
<tspan x="849" dy="0">Learn SGS stress, constitutive</tspan>
<tspan x="849" dy="21.6">response, breakup, entrainment, or</tspan>
<tspan x="849" dy="21.6">discrepancy memory.</tspan>
</text>
<rect x="1195" y="305" width="350" height="475" rx="18" fill="#ffffff" stroke="#d7d6cf" stroke-width="1.5" filter="url(#shadow)" opacity="1.0"/>
<rect x="1195" y="305" width="350" height="7" rx="4" fill="#6b7280"/>
<text x="1219" y="353" text-anchor="start" fill="#17191d" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:24px;font-weight:700;">Forcing + boundaries</text>
<text x="1219" y="388" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;">PHYSICAL ROLE</text>
<text x="1219" y="415" text-anchor="start" fill="#17191d" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:17px;font-weight:400;">
<tspan x="1219" dy="0">Gravity, geometry, wavemakers,</tspan>
<tspan x="1219" dy="22.950000000000003">walls, inflow, and the measured</tspan>
<tspan x="1219" dy="22.950000000000003">initial state drive the problem.</tspan>
</text>
<text x="1219" y="490" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;">CLASSICAL NUMERICS</text>
<text x="1219" y="517" text-anchor="start" fill="#17191d" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:17px;font-weight:400;">
<tspan x="1219" dy="0">Boundary conditions, immersed</tspan>
<tspan x="1219" dy="22.950000000000003">geometry, source terms,</tspan>
<tspan x="1219" dy="22.950000000000003">calibration, and data assimilation.</tspan>
</text>
<rect x="1213" y="675" width="314" height="82" rx="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" stroke-dasharray="7 6" opacity="1.0"/>
<text x="1229" y="705" text-anchor="start" fill="#111827" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:12px;font-weight:800;letter-spacing:1.4px;">LEARNED LANE</text>
<text x="1229" y="731" text-anchor="start" fill="#111827" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:16px;font-weight:400;">
<tspan x="1229" dy="0">Infer uncertain forcing, boundary</tspan>
<tspan x="1229" dy="21.6">state, roughness, geometry, or hidden</tspan>
<tspan x="1229" dy="21.6">state from sensors.</tspan>
</text>
<rect x="185" y="825" width="1230" height="128" rx="20" fill="#f3f4f6" stroke="#111827" stroke-width="2" stroke-dasharray="10 8" opacity="1.0"/>
<rect x="185" y="825" width="1230" height="128" rx="20" fill="url(#dotgrid)" opacity="0.6"/>
<rect x="220" y="848" width="185" height="36" rx="18.0" fill="#111827" stroke="#111827" stroke-width="1.5" opacity="1.0"/>
<text x="312.5" y="872.48" text-anchor="middle" fill="#ffffff" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:15px;font-weight:700;">WHOLE OPERATOR</text>
<text x="430" y="875" text-anchor="start" fill="#111827" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:25px;font-weight:700;">surrogate · neural operator · learned rollout</text>
<text x="430" y="910" text-anchor="start" fill="#5c6470" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:17px;font-weight:400;">
<tspan x="430" dy="0">Wraps the entire map from geometry, forcing, or current state to a future field.</tspan>
<tspan x="430" dy="22.950000000000003">Usually the largest speedup—and the largest extrapolation and authority risk.</tspan>
</text>
<line x1="70" y1="990" x2="1530" y2="990" stroke="#d7d6cf" stroke-width="1" stroke-linecap="round" opacity="1.0"/>
<text x="70" y="1015" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:15px;font-weight:600;">Color = physical quantity</text>
<text x="340" y="1015" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:15px;font-weight:600;">solid card = classical numerical operation</text>
<text x="725" y="1015" text-anchor="start" fill="#5c6470" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:15px;font-weight:600;">dashed / dotted = learned approximation</text>
<text x="1110" y="1015" text-anchor="start" fill="#7c3aed" opacity="1.0" style="font-family:DejaVu Sans, Arial, sans-serif;font-size:15px;font-weight:700;">violet = residual, divergence, or failure</text>
</svg>